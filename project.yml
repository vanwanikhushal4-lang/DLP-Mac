name: VeloxMacDLP
options:
  bundleIdPrefix: co.velox
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: "Manual"
    CODE_SIGN_IDENTITY: "Apple Development: Vikas Bhoir (JZFXU9DXS8)"
    DEVELOPMENT_TEAM: "L7US4BH7Q2"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  VeloxCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity"]

  VeloxExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/VeloxExtension/main.swift
    info:
      path: Sources/VeloxExtension/Info.plist
      properties:
        CFBundlePackageType: SYSX
    entitlements:
      path: Sources/VeloxExtension/VeloxMacDLPSE.entitlements
      properties:
        com.apple.developer.endpoint-security.client: true
    dependencies:
      - target: VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.macdlp.endpointsecurity
        PRODUCT_NAME: co.velox.macdlp.endpointsecurity
        WRAPPER_EXTENSION: systemextension
        CODE_SIGN_STYLE: "Manual"
        CODE_SIGN_ENTITLEMENTS: Sources/VeloxExtension/VeloxMacDLPSE.entitlements
        CODE_SIGN_IDENTITY: "Apple Development: Vikas Bhoir (JZFXU9DXS8)"
        DEVELOPMENT_TEAM: "L7US4BH7Q2"
        PROVISIONING_PROFILE_SPECIFIER: "Velox Mac DLP Endpoint Security Profile"
        PROVISIONING_PROFILE: "4A9F2184-7F89-4D78-BC84-5C0D80E9A5B3"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity"]

  VeloxMacDLP:
    type: application
    platform: macOS
    sources:
      - path: Sources/VeloxApp/AppDelegate.swift
      - path: Sources/VeloxApp/main.swift
    info:
      path: Sources/VeloxApp/Info.plist
      properties:
        LSUIElement: true
    entitlements:
      path: Sources/VeloxApp/VeloxMacDLP.entitlements
      properties:
        com.apple.developer.system-extension.install: true
    dependencies:
      - target: VeloxCore
      - target: VeloxExtension
        embed: true
        destination: custom
        subpath: Contents/Library/SystemExtensions
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.macdlp
        PRODUCT_NAME: VeloxMacDLP
        CODE_SIGN_STYLE: "Manual"
        CODE_SIGN_ENTITLEMENTS: Sources/VeloxApp/VeloxMacDLP.entitlements
        CODE_SIGN_IDENTITY: "Apple Development: Vikas Bhoir (JZFXU9DXS8)"
        DEVELOPMENT_TEAM: "L7US4BH7Q2"
        PROVISIONING_PROFILE_SPECIFIER: "Velox Mac DLP Host Profile"
        PROVISIONING_PROFILE: "1B3C84E2-9A47-4952-B9CD-49D97E05C82A"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity"]

  VeloxCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VeloxCoreTests
    dependencies:
      - target: VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.core.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity"]
