name: VeloxMacDLP
options:
  bundleIdPrefix: co.velox
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
  Distribution: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: "Automatic"
    DEVELOPMENT_TEAM: "L7US4BH7Q2"
    ENABLE_HARDENED_RUNTIME: YES
schemes:
  VeloxOCRTests:
    build:
      targets:
        VeloxOCRTests: test
    test:
      targets:
        - VeloxOCRTests
targets:
  VeloxCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity"]
  VeloxExtension:
    type: system-extension
    platform: macOS
    configFiles:
      Debug: Config/VeloxEndpointSecurity-Development.xcconfig
      Release: Config/VeloxEndpointSecurity-Development.xcconfig
      Distribution: Config/VeloxEndpointSecurity-Distribution.xcconfig
    sources:
      - path: Sources/VeloxExtension/main.swift
      - path: Sources/VeloxExtension/ControlService.swift
      - path: Sources/VeloxExtension/PrinterControlCoordinator.swift
      - path: Sources/VeloxExtension/USBEncryptionCoordinator.swift
    info:
      path: Sources/VeloxExtension/Info.plist
      properties:
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: "1.15.0"
        CFBundleVersion: "31"
        NSSystemExtensionUsageDescription: Velox Mac DLP monitors and controls application execution to enforce organizational security policy.
        NSEndpointSecurityMachServiceName: L7US4BH7Q2.co.velox.macdlp.endpointsecurity.xpc
    dependencies:
      - target: VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.macdlp.endpointsecurity
        PRODUCT_NAME: co.velox.macdlp.endpointsecurity
        WRAPPER_EXTENSION: systemextension
        DEVELOPMENT_TEAM: "L7US4BH7Q2"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity"]
  VeloxSafariUploadGuard:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/VeloxSafariUploadGuard-Development.xcconfig
      Release: Config/VeloxSafariUploadGuard-Development.xcconfig
      Distribution: Config/VeloxSafariUploadGuard-Distribution.xcconfig
    sources:
      - path: Sources/VeloxSafariUploadGuard/SafariWebExtensionHandler.swift
      - path: Sources/VeloxSafariUploadGuard/SafariUploadGuardControlClient.swift
      - path: BrowserExtensions/VeloxUploadGuard/manifest.json
        buildPhase: resources
      - path: BrowserExtensions/VeloxUploadGuard/background.js
        buildPhase: resources
      - path: BrowserExtensions/VeloxUploadGuard/content.js
        buildPhase: resources
    info:
      path: Sources/VeloxSafariUploadGuard/Info.plist
      properties:
        CFBundleDisplayName: Velox DLP Upload Guard
        CFBundleShortVersionString: "1.15.0"
        CFBundleVersion: "31"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Sources/VeloxSafariUploadGuard/VeloxSafariUploadGuard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - L7US4BH7Q2.co.velox.macdlp.endpointsecurity.xpc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.macdlp.uploadguard
        PRODUCT_NAME: VeloxDLPUploadGuard
        CODE_SIGN_ENTITLEMENTS: Sources/VeloxSafariUploadGuard/VeloxSafariUploadGuard.entitlements
        DEVELOPMENT_TEAM: "L7US4BH7Q2"
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VeloxNetworkFilter:
    type: system-extension
    platform: macOS
    configFiles:
      Debug: Config/VeloxNetworkFilter-Development.xcconfig
      Release: Config/VeloxNetworkFilter-Development.xcconfig
      Distribution: Config/VeloxNetworkFilter-Distribution.xcconfig
    sources:
      - path: Sources/VeloxNetworkFilter/main.swift
      - path: Sources/VeloxNetworkFilter/FilterDataProvider.swift
      - path: Sources/VeloxNetworkFilter/NetworkEventForwarder.swift
    info:
      path: Sources/VeloxNetworkFilter/Info.plist
      properties:
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: "1.15.0"
        CFBundleVersion: "31"
        NSSystemExtensionUsageDescription: Velox Mac DLP monitors and filters outbound network flow connections according to organizational security policy.
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)co.velox.macdlp.networkfilter.xpc
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    dependencies:
      - target: VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.macdlp.networkfilter
        PRODUCT_NAME: co.velox.macdlp.networkfilter
        WRAPPER_EXTENSION: systemextension
        DEVELOPMENT_TEAM: "L7US4BH7Q2"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "NetworkExtension", "-lEndpointSecurity"]
  VeloxMacDLP:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/VeloxMacDLP-Development.xcconfig
      Release: Config/VeloxMacDLP-Development.xcconfig
      Distribution: Config/VeloxMacDLP-Distribution.xcconfig
    sources:
      - path: Sources/VeloxApp/AppDelegate.swift
      - path: Sources/VeloxApp/BundledWebSchemeHandler.swift
      - path: Sources/VeloxApp/main.swift
      - path: Sources/VeloxApp/ConsoleController.swift
      - path: Sources/VeloxApp/ExtensionControlClient.swift
      - path: Sources/VeloxApp/InstalledApplicationScanner.swift
      - path: Sources/VeloxApp/PasteboardMonitor.swift
      - path: Sources/VeloxApp/OCRService.swift
      - path: Sources/VeloxApp/EgressClassificationCoordinator.swift
      - path: Sources/VeloxApp/EndpointDiscoveryService.swift
      - path: Sources/VeloxApp/ScreenshotOCRMonitor.swift
      - path: Sources/VeloxApp/VeloxNotificationManager.swift
      - path: Sources/VeloxApp/VeloxActiveEventMonitor.swift
      - path: Sources/VeloxApp/VeloxLiveLogCommand.swift
      - path: Web/dist
        type: folder
        buildPhase: resources
      - path: Resources/VeloxAppIcon.icns
        buildPhase: resources
    info:
      path: Sources/VeloxApp/Info.plist
      properties:
        CFBundleIconFile: VeloxAppIcon
        CFBundleShortVersionString: "1.15.0"
        CFBundleVersion: "31"
        LSUIElement: true
        SBAppUsesLocalNotifications: true
        NSUserNotificationAlertStyle: alert
        NSSystemExtensionUsageDescription: Velox Mac DLP installs security and network-filter system extensions to enforce organizational data-loss-prevention policy.
    dependencies:
      - target: VeloxCore
      - target: VeloxExtension
        embed: true
        destination: custom
        subpath: Contents/Library/SystemExtensions
        codeSign: true
      - target: VeloxNetworkFilter
        embed: true
        destination: custom
        subpath: Contents/Library/SystemExtensions
        codeSign: true
      - target: VeloxSafariUploadGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.macdlp
        PRODUCT_NAME: VeloxMacDLP
        DEVELOPMENT_TEAM: "L7US4BH7Q2"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity", "-framework", "Vision", "-framework", "PDFKit", "-framework", "ImageIO"]
  VeloxCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VeloxCoreTests
    dependencies:
      - target: VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.core.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity"]
  VeloxOCRTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VeloxAppTests/OCRServiceTests.swift
      - path: Tests/VeloxAppTests/EndpointDiscoveryServiceTests.swift
      - path: Sources/VeloxApp/OCRService.swift
      - path: Sources/VeloxApp/EndpointDiscoveryService.swift
      - path: Sources/VeloxApp/ExtensionControlClient.swift
      - path: Sources/VeloxApp/VeloxNotificationManager.swift
    dependencies:
      - target: VeloxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.velox.ocr.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lEndpointSecurity", "-framework", "Vision", "-framework", "PDFKit", "-framework", "ImageIO"]
